<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padaria Cinco Pães</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header>
        <img class="img-painel" src="./assets/hero.jpg" alt="Painel da padaria">
        <div class="hero-content">
            <h1>Do nosso forno <br> para a sua mesa</h1>
            <button class="prim-button">Ver cardápio</button>
        </div>
    </header>
    
            <h2>Cardápio</h2>
            <div class="cardapio-header">
                <button class="show-all">Todos</button>
                <button class="show-salgados">Salgados</button>
                <button class="show-bolos">Bolos</button>
                <button class="show-paes-e-doces">Pães & Doces</button>
                <button class="show-bebidas">Bebidas</button>
            </div>

<main>

            <div class="cardapio">
                
                    <div class="card">
                        <div class="card-emoji">
                            <emoji alt="Coxinha de frango">🍗</emoji>
                        </div>
                        <div>
                            <h3>Coxinha de frango</h3>
                            <p class="description">Massa crocante, recheio cremoso</p>
                            <div class="card-footer">
                                <p class="price">R$ 7,00</p>
                                <button class="Add">Adicionar</button>
                            </div>
                        </div>
                    </div>

            </div>

            <div class="pedido">
                
                <h2>Seu pedido</h2>
                <p class="description">Adicione itens do cardápio.</p>
                    <div class="value-itens">
                        <h5>Total</h5>
                        <p class="price">R$ 0,00</p> 
                    </div>
                <input placeholder="seu nome">
                <button>Enviar pelo WhatsApp</button>

            </div>

</main>

    <footer>Padaria Pão Dourado · Aberto todos os dias, 6h às 19h</footer>

</body>
<script src="./products.js"></script>
<script src="./scripts.js"></script>
</html>
